<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171d2b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Our Home"><link rel="manifest" href="./manifest.webmanifest"><title>Our Home</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f5f7ff;background:#121827}*{box-sizing:border-box}body{margin:0}.wrap{max-width:560px;margin:auto;padding:26px 18px 65px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:32px;margin:4px 0 24px}small,.muted{color:#a9b6cd}.tag{font-size:12px;color:#8fe5c5}.card{background:#202b40;border:1px solid #35425c;border-radius:18px;padding:18px;margin:14px 0}h2{font-size:19px;margin:0 0 14px}.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}button{border:0;border-radius:12px;background:#d7b46e;color:#1b2332;font-weight:700;padding:12px 17px;cursor:pointer}.nav button{font-size:23px;padding:5px 16px}.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid #39445a}.emoji{font-size:26px}.info{flex:1}.info b{display:block}.info small{display:block;margin-top:3px}input[type=checkbox]{width:25px;height:25px;accent-color:#8fe5c5}input:not([type=checkbox]){display:block;width:100%;margin:8px 0 13px;padding:12px;background:#131c2d;color:white;border:1px solid #4a5770;border-radius:9px}label{font-size:14px}.progress{height:10px;border-radius:9px;background:#46536a;overflow:hidden;margin-top:12px}.fill{height:100%;background:#8fe5c5;width:0}.hidden{display:none}.actions{display:flex;gap:10px;flex-wrap:wrap}.secondary{background:#39465c;color:white}.error{color:#ff9e9e}footer{text-align:center;color:#a9b6cd;padding:25px}
</style></head><body><main class="wrap"><header><div><small>KAILEY + BLAKE</small><h1>Our Home 🏡</h1></div><span class="tag" id="status">Not connected</span></header>
<section class="card hidden" id="setup"><h2>Connect your household</h2><p class="muted">Set up a free Firebase project to sync both phones. Enter its web app settings here.</p><form id="configForm"><label>API key<input id="apiKey" required></label><label>Auth domain<input id="authDomain" required placeholder="project.firebaseapp.com"></label><label>Project ID<input id="projectId" required></label><label>App ID<input id="appId" required></label><button>Save connection</button></form></section>
<section class="card hidden" id="login"><h2>Household sign in</h2><p class="muted">Use the same household email and password on both phones.</p><form id="loginForm"><label>Email<input type="email" id="email" required></label><label>Password<input type="password" id="password" minlength="6" required></label><div class="actions"><button>Sign in</button><button type="button" id="signup" class="secondary">Create account</button></div></form><p id="error" class="error"></p><button id="changeConfig" class="secondary">Change connection</button></section>
<div id="app" class="hidden"><section class="card"><div class="nav"><button id="prev" aria-label="Previous day">‹</button><b id="date"></b><button id="next" aria-label="Next day">›</button></div><p class="muted" id="rotation"></p><div style="display:flex;justify-content:space-between"><b>Daily progress</b><span id="count">0 / 7</span></div><div class="progress"><div class="fill" id="fill"></div></div></section><section class="card"><h2>Daily chores</h2><div id="tasks"></div></section><div class="actions"><button id="today">Today</button><button id="logout" class="secondary">Sign out</button></div></div><footer>Made for Kailey & Blake ♥</footer></main><script type="module" src="./app.js"></script></body></html>
